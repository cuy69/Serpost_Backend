spring:
  application:
    name: GestionarCliente
  datasource:
    url: jdbc:h2:mem:clientes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:https://issuer.example}
server:
  port: ${PORT:8080}
  request:
    header:
      forwarded:
        strategy: framework
serpost:
  envios:
    base-url: ${SERPOST_ENVIOS_BASE_URL:http://127.0.0.1:3001}
  notificaciones:
    intervalo-procesamiento-ms: 250
    reintentos:
      maximo: 3
  tarifas:
    reglas:
      - linea-negocio: Encomienda
        origen: Chimbote
        destino: Lima
        tipo-servicio: Estándar
        peso-min-kg: 0.1
        peso-max-kg: 5.0
        tarifa-base: 10.00
        recargos: 2.00
        tasa-igv: 18
        moneda: PEN
