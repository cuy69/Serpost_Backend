spring:
  application:
    name: GestionarCliente
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/serpost}
    username: ${DATABASE_USERNAME:serpost}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER_URI:https://issuer.example}
server:
  port: ${PORT:8080}
  request:
    header:
      forwarded:
        strategy: framework
serpost:
  notificaciones:
    intervalo-procesamiento-ms: 250
    reintentos:
      maximo: 3
  tarifas:
    reglas:
      - linea-negocio: Encomienda
        origen: Chimbote
        destino: Lima
        tipo-servicio: Estándar
        peso-min-kg: 0.1
        peso-max-kg: 5.0
        tarifa-base: 10.00
        recargos: 2.00
        tasa-igv: 18
        moneda: PEN
services:
  guias:
    tracking-base-url: ${GUIAS_TRACKING_BASE_URL:http://localhost:8080/guias}
