services:
  postgres:
    image: postgres:18.7
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-serpost}
      POSTGRES_USER: ${POSTGRES_USER:-serpost}
      POSTGRES_PASSWORD: ${SERPOST_DB_PASSWORD:?Define SERPOST_DB_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-serpost} -d ${POSTGRES_DB:-serpost}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-serpost}
      DATABASE_USERNAME: ${POSTGRES_USER:-serpost}
      DATABASE_PASSWORD: ${SERPOST_DB_PASSWORD:?Define SERPOST_DB_PASSWORD en .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-serpost}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-serpost}
      SPRING_DATASOURCE_PASSWORD: ${SERPOST_DB_PASSWORD:?Define SERPOST_DB_PASSWORD en .env}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-serpost}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-serpost}
      SPRING_FLYWAY_PASSWORD: ${SERPOST_DB_PASSWORD:?Define SERPOST_DB_PASSWORD en .env}
      OAUTH_ISSUER_URI: ${OAUTH_ISSUER_URI:-https://issuer.example}
